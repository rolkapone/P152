/* ------------------------------------------------------------------ renderer, studio environment, lights */

// Procedural studio environment (no file): grey room + emissive softboxes, baked once with PMREM.
function buildStudioEnv() {
  const s = new THREE.Scene();
  const room = new THREE.Mesh(new THREE.BoxGeometry(14, 7, 14), new THREE.MeshBasicMaterial({ color: 0x77777c, side: THREE.BackSide }));
  room.position.y = 3.5; s.add(room);
  const box = (w, h, pos, v) => {
    const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshBasicMaterial({ color: new THREE.Color().setScalar(v), side: THREE.DoubleSide }));
    m.position.set(...pos); m.lookAt(0, 1, 0); s.add(m);
  };
  box(4.5, 3.2, [3.5, 4.2, 3.5], 7);                  // key softbox, front right
  box(2.2, 4.5, [-5, 2.6, 1.5], 3);                   // fill strip, left
  box(6, 0.7, [0, 6.4, -1], 5);                       // overhead strip
  box(1.4, 4.5, [-2.5, 2.6, -6], 4);                  // rim strip, behind
  return s;
}
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(buildStudioEnv(), 0.03).texture;

const camera = new THREE.PerspectiveCamera(32, 1, 0.1, 40);

/* Seamless cyclorama: floor curving up into the back wall with no visible seam. Profile in (z, y). */
function buildCyclo() {
  const prof = [[9, 0], [-1.6, 0]], R = 1.5, cz = -1.6, N = 18;
  for (let i = 1; i <= N; i++) { const t = i / N * Math.PI / 2; prof.push([cz - R * Math.sin(t), R - R * Math.cos(t)]); }
  prof.push([cz - R, 7]);
  const X = 16, pos = [], nor = [], idx = [];
  prof.forEach(([z, y], i) => {
    const a = prof[Math.max(i - 1, 0)], b = prof[Math.min(i + 1, prof.length - 1)];
    let tz = b[0] - a[0], ty = b[1] - a[1]; const l = Math.hypot(tz, ty); tz /= l; ty /= l;
    for (const x of [-X, X]) { pos.push(x, y, z); nor.push(0, -tz, ty); }   // normal (y, z) = (-tz, ty)
  });
  for (let i = 0; i < prof.length - 1; i++) { const a = i * 2; idx.push(a, a + 1, a + 2, a + 1, a + 3, a + 2); }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute('normal', new THREE.Float32BufferAttribute(nor, 3));
  g.setIndex(idx); return g;
}
const floor = new THREE.Mesh(buildCyclo(), new THREE.MeshStandardMaterial({ color: '#e2e2e5', roughness: 0.92, side: THREE.DoubleSide, envMapIntensity: 0.6 }));
floor.receiveShadow = true; scene.add(floor);

/* Contact shadows: one soft rounded-rectangle gradient under each object (generated once, shared). */
const contactTex = (() => {
  const n = 128, cv = document.createElement('canvas'); cv.width = cv.height = n;
  const ctx = cv.getContext('2d'), im = ctx.createImageData(n, n);
  const sm = (a, b, x) => { const t = Math.min(Math.max((x - a) / (b - a), 0), 1); return t * t * (3 - 2 * t); };
  for (let j = 0; j < n; j++) for (let i = 0; i < n; i++) {
    const px = Math.abs((i + .5) / n * 2 - 1) - 0.62, py = Math.abs((j + .5) / n * 2 - 1) - 0.62, r = 0.18;
    const qx = px + r, qy = py + r, d = Math.hypot(Math.max(qx, 0), Math.max(qy, 0)) + Math.min(Math.max(qx, qy), 0) - r;
    const a = Math.pow(1 - sm(-0.08, 0.38, d), 1.6), k = (j * n + i) * 4;
    im.data[k] = im.data[k + 1] = im.data[k + 2] = 0; im.data[k + 3] = Math.round(255 * a);
  }
  ctx.putImageData(im, 0, 0);
  const t = new THREE.CanvasTexture(cv); t.anisotropy = 2; return t;
})();
const contactMat = new THREE.MeshBasicMaterial({ map: contactTex, transparent: true, depthWrite: false, opacity: 0.5, fog: false });
const contactGeo = new THREE.PlaneGeometry(1, 1).rotateX(-Math.PI / 2);
// Footprint w x d (m). The gradient core covers 62 % of the plane, so the plane is 1/0.62 larger than the footprint.
function contact(parent, w, d, x = 0, y = 0.0015, z = 0) {
  const m = new THREE.Mesh(contactGeo, contactMat);
  m.scale.set(w / 0.62, 1, d / 0.62); m.position.set(x, y, z); m.renderOrder = 1; parent.add(m); return m;
}

/* ------------------------------------------------------------------ helpers */
const PLACEHOLDER = new THREE.MeshStandardMaterial();
const tagged = [];                                   // every mesh that takes a catalog material
const rbox = (w, h, d, r, seg = 4) => new RoundedBoxGeometry(w, h, d, seg, Math.min(r, w / 2 - 1e-4, h / 2 - 1e-4, d / 2 - 1e-4));
function add(group, geo, type, role, x = 0, y = 0, z = 0, noShadow = false) {
  const m = new THREE.Mesh(geo, PLACEHOLDER);
  m.userData = { type, role }; m.position.set(x, y, z);
  m.castShadow = !noShadow; m.receiveShadow = true;
  group.add(m); tagged.push(m); return m;
}
function limb(group, a, b, r, type, role) {          // cylinder between two points
  const A = new THREE.Vector3(...a), B = new THREE.Vector3(...b), dir = B.clone().sub(A), len = dir.length();
  const m = add(group, new THREE.CylinderGeometry(r, r, len, 16), type, role);
  m.position.copy(A).addScaledVector(dir, 0.5);
  m.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), dir.normalize());
  return m;
}
function roundedRectShape(w, d, r) {
  const s = new THREE.Shape(), x = -w / 2, y = -d / 2;
  s.moveTo(x + r, y); s.lineTo(x + w - r, y); s.quadraticCurveTo(x + w, y, x + w, y + r);
  s.lineTo(x + w, y + d - r); s.quadraticCurveTo(x + w, y + d, x + w - r, y + d);
  s.lineTo(x + r, y + d); s.quadraticCurveTo(x, y + d, x, y + d - r);
  s.lineTo(x, y + r); s.quadraticCurveTo(x, y, x + r, y); return s;
}

const DESK_W = 1.4, DESK_D = 0.7, DESK_H = 0.74, DESK_T = 0.025;
const PAD_TOP = 0.0056;                              // mouse pad top above the desk surface (m)

/* ------------------------------------------------------------------ generic objects (millimetres -> metres) */
function makeDesk() {
  const g = new THREE.Group();
  add(g, rbox(DESK_W, DESK_T, DESK_D, 0.009), 'desk', 'top', 0, DESK_H - DESK_T / 2, 0);
  for (const sx of [-1, 1]) for (const sz of [-1, 1]) {
    add(g, new THREE.CylinderGeometry(0.022, 0.018, DESK_H - DESK_T, 24), 'desk', 'legs', sx * 0.64, (DESK_H - DESK_T) / 2, sz * 0.29);
    contact(g, 0.07, 0.07, sx * 0.64, 0.0015, sz * 0.29);                // each foot touches the floor
  }
  add(g, rbox(1.28, 0.07, 0.016, 0.006), 'desk', 'legs', 0, DESK_H - DESK_T - 0.045, -0.29);
  contact(g, 1.5, 0.8, 0, 0.001, 0).material = contactMat;               // broad ambient occlusion under the desk
  return g;
}

function makeMonitor(diagIn = 27, ratio = [16, 9]) {   // origin = panel centre, screen faces +Z (generic flat panel)
  const g = new THREE.Group(), d = diagIn * 0.0254, k = d / Math.hypot(ratio[0], ratio[1]);
  const w = ratio[0] * k, h = ratio[1] * k, bz = 0.007, th = 0.012;
  add(g, rbox(w + 2 * bz, h + 2 * bz, th, 0.0059), 'monitor', 'body');
  add(g, new THREE.PlaneGeometry(w, h), 'monitor', 'screen', 0, 0, th / 2 + 0.0004, true);
  add(g, rbox(w * 0.5, h * 0.55, 0.025, 0.011), 'monitor', 'body', 0, 0, -(th / 2 + 0.0105));
  g.userData.h = h + 2 * bz;
  return g;
}

function makeMonitorArm() {                           // origin = pole axis at the desk surface, reaches toward +Z
  const g = new THREE.Group(), T = 'monitor-arm', R = 'metal';
  add(g, rbox(0.06, 0.012, 0.09, 0.0055), T, R, 0, 0.006, 0);                // top plate
  add(g, rbox(0.06, 0.05, 0.012, 0.005), T, R, 0, -0.018, -0.051);          // back plate
  add(g, rbox(0.06, 0.012, 0.06, 0.0055), T, R, 0, -DESK_T - 0.006, -0.021); // under plate
  add(g, new THREE.CylinderGeometry(0.016, 0.016, 0.43, 24), T, R, 0, 0.215, 0);
  add(g, new THREE.CylinderGeometry(0.026, 0.026, 0.04, 28), T, R, 0, 0.43, 0);
  add(g, rbox(0.04, 0.034, 0.17, 0.012), T, R, 0, 0.43, 0.085);

const matCache = new Map(), screenTex = new Map();

}

  if (matCache.has(cacheKey)) return matCache.get(cacheKey);

/* Ambience as a set of animatable values; `live` is what is currently on screen. */
let studio = 'light', current = STYLES[0], trans = null;

function targetOf(style) {

    exposure: a.exposure, key: a.keyIntensity, hemi: a.hemiIntensity, env: a.envIntensity + (dark ? s.envBias : 0), rim: s.rim,

  live.bg.copy(v.bg); live.floor.copy(v.floor); live.keyC.copy(v.keyC);

    exposure: mix(from.exposure, to.exposure, e), key: mix(from.key, to.key, e), hemi: mix(from.hemi, to.hemi, e), env: mix(from.env, to.env, e),
    rim: mix(from.rim, to.rim, e), lamp: mix(from.lamp, to.lamp, e), plant: mix(from.plant, to.plant, e)

  const c = camTween, k = Math.min((now - c.t0) / c.dur, 1), e = ease(k);
  let dth = c.toS.theta - c.fromS.theta; dth = Math.atan2(Math.sin(dth), Math.cos(dth));     // shortest way round
  const s = new THREE.Spherical(mix(c.fromS.radius, c.toS.radius, e), mix(c.fromS.phi, c.toS.phi, e), c.fromS.theta + dth * e);
  controls.target.lerpVectors(c.fromT, c.toT, e);
  camera.position.setFromSpherical(s).add(controls.target);
  if (k >= 1) camTween = null;
}
['pointerdown', 'wheel'].forEach(ev => canvas.addEventListener(ev, () => { camTween = null; }, { passive: true }));   // the user takes over
document.querySelectorAll('[data-view]').forEach(b => b.addEventListener('click', () => setView(b.dataset.view)));
matchMedia('(prefers-reduced-motion: reduce)').addEventListener?.('change', () => { controls.enableDamping = !reducedMotion(); });

function resize() { const w = innerWidth, h = innerHeight; renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix(); }
addEventListener('resize', resize); resize(); setView('reset', true);
transitionTo(STYLES[0], { instant: true });

const stats = document.getElementById('stats');
let last = 0, maxCalls = 0, maxTris = 0;
renderer.setAnimationLoop(t => {
  stepCamera(t); stepTransition(performance.now());
  controls.update(); renderer.render(scene, camera);
  const r = renderer.info.render; maxCalls = Math.max(maxCalls, r.calls); maxTris = Math.max(maxTris, r.triangles);   // max keeps shadow-pass frames visible
  if (t - last > 500) {
    last = t;
    stats.innerHTML = `Draw calls <b>${maxCalls}</b> (budget 150) &middot; Triangles <b>${maxTris.toLocaleString('en')}</b> (budget 300k)`;
    maxCalls = maxTris = 0;
  }
});
</script>
<script>
  // shown only if the module above failed (e.g. offline)
  addEventListener('error', e => { if (e.target && e.target.tagName === 'SCRIPT') document.getElementById('err').style.display = 'block'; }, true);
  window.addEventListener('unhandledrejection', () => { document.getElementById('err').style.display = 'block'; });
</script>
</body>
